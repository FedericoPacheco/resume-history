pdf-engine: xelatex
metadata:
  colorlinks: true
  linkcolor: "googleblue"
  urlcolor: "googleblue"
  citecolor: "googleblue"
variables:
  geometry: margin=0.25in
  fontsize: 10pt
  linestretch: 1 # spacing between lines
  mainfont: "Latin Modern Roman" # classic LaTeX font
  monofont: "Latin Modern Mono"
  pagestyle: empty # remove headers/footers

include-in-header: header.tex
